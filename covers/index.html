<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covers</title>
<script>
  // Applied before paint so the saved theme never flashes the wrong palette.
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #ECE0C4;
    --ink: #584E3B;
    --rule: #B4B09F;
    --card: #DEBC78;
    --accent: #BB654A;
    --veil: rgba(236, 224, 196, .96);
    --veil-ink: #584E3B;
    --veil-btn: rgba(88, 78, 59, .10);
    --veil-btn-hover: rgba(88, 78, 59, .22);
    --veil-edge: rgba(88, 78, 59, .35);
    --veil-shadow: rgba(88, 78, 59, .30);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2b2620;
      --ink: #ECE0C4;
      --rule: #5F6247;
      --card: #3a332a;
      --accent: #DEBC78;
      --veil: rgba(18, 15, 12, .94);
      --veil-ink: #ECE0C4;
      --veil-btn: rgba(0, 0, 0, .35);
      --veil-btn-hover: rgba(0, 0, 0, .60);
      --veil-edge: rgba(236, 224, 196, .35);
      --veil-shadow: rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2b2620;
    --ink: #ECE0C4;
    --rule: #5F6247;
    --card: #3a332a;
    --accent: #DEBC78;
    --veil: rgba(18, 15, 12, .94);
    --veil-ink: #ECE0C4;
    --veil-btn: rgba(0, 0, 0, .35);
    --veil-btn-hover: rgba(0, 0, 0, .60);
    --veil-edge: rgba(236, 224, 196, .35);
    --veil-shadow: rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  header {
    max-width: 1400px;
    margin: 0 auto 1.5rem;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 1rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  .count { margin: 0; color: var(--accent); font-size: .95rem; }
  #theme-toggle {
    flex: none;
    width: 2.25rem;
    height: 2.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 50%;
    line-height: 0;
  }
  #theme-toggle:hover, #theme-toggle:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    outline: none;
  }
  #theme-toggle svg { width: 1.1rem; height: 1.1rem; }
  /* Sun shows in dark mode (click for light), moon in light mode. */
  #theme-toggle .sun { display: none; }
  :root[data-theme="dark"] #theme-toggle .sun { display: block; }
  :root[data-theme="dark"] #theme-toggle .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #theme-toggle .sun { display: block; }
    :root:not([data-theme="light"]) #theme-toggle .moon { display: none; }
  }
  .grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1.25rem;
  }
  .cell {
    display: block;
    text-decoration: none;
    color: var(--ink);
  }
  .cell img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .cell:hover img, .cell:focus img {
    border-color: var(--accent);
    transform: scale(1.03);
    outline: none;
  }
  .cap {
    display: block;
    margin-top: .4rem;
    text-align: center;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    opacity: .75;
    word-break: break-word;
  }
  /* Full-viewport viewer */
  #viewer {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    padding: 1.5rem;
    background: var(--veil);
    cursor: zoom-out;
  }
  #viewer[open] { display: flex; }
  #viewer img {
    max-width: 100%;
    max-height: calc(100vh - 6rem);
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 12px 40px var(--veil-shadow);
  }
  #viewer-cap {
    color: var(--veil-ink);
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  #viewer button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 2.75rem;
    height: 2.75rem;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    color: var(--veil-ink);
    background: var(--veil-btn);
    border: 1px solid var(--veil-edge);
    border-radius: 50%;
  }
  #viewer button:hover { background: var(--veil-btn-hover); }
  #viewer .prev { left: 1rem; }
  #viewer .next { right: 1rem; }
  #viewer .close { top: 1rem; right: 1rem; transform: none; font-size: 1.25rem; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Covers</h1>
      <p class="count"></p>
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>
  <main>
    <div class="grid">
      <a class="cell" href="000.jpeg" data-name="000">
        <img src="000.jpeg" alt="000" loading="lazy">
        <span class="cap">000</span>
      </a>
      <a class="cell" href="000a.png" data-name="000a">
        <img src="000a.png" alt="000a" loading="lazy">
        <span class="cap">000a</span>
      </a>
      <a class="cell" href="001.jpeg" data-name="001">
        <img src="001.jpeg" alt="001b" loading="lazy">
        <span class="cap">001</span>
      </a>
      <a class="cell" href="002.jpeg" data-name="002">
        <img src="002.jpeg" alt="002" loading="lazy">
        <span class="cap">002</span>
      </a>
      <a class="cell" href="003.jpeg" data-name="003">
        <img src="003.jpeg" alt="003" loading="lazy">
        <span class="cap">003</span>
      </a>
      <a class="cell" href="004.png" data-name="004">
        <img src="004.png" alt="004" loading="lazy">
        <span class="cap">004</span>
      </a>
    </div>
  </main>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close" type="button" aria-label="Close">&#10005;</button>
    <button class="prev" type="button" aria-label="Previous image">&#8249;</button>
    <img id="viewer-img" src="" alt="">
    <p id="viewer-cap"></p>
    <button class="next" type="button" aria-label="Next image">&#8250;</button>
  </div>

<script>
(function () {
  // ---- theme toggle -------------------------------------------------------
  var root = document.documentElement;
  var toggle = document.getElementById("theme-toggle");

  function currentTheme() {
    var set = root.getAttribute("data-theme");
    if (set) return set;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  toggle.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  // ---- viewport-size viewer ----------------------------------------------
  var cells = Array.prototype.slice.call(document.querySelectorAll(".grid .cell"));
  var viewer = document.getElementById("viewer");
  var viewerImg = document.getElementById("viewer-img");
  var viewerCap = document.getElementById("viewer-cap");
  var index = -1;

  document.querySelector(".count").textContent = cells.length + " covers";

  function show(i) {
    if (i < 0) i = cells.length - 1;
    if (i >= cells.length) i = 0;
    index = i;
    var cell = cells[i];
    viewerImg.src = cell.getAttribute("href");
    viewerImg.alt = cell.dataset.name;
    viewerCap.textContent = cell.dataset.name + "  ·  " + (i + 1) + " / " + cells.length;
    viewer.setAttribute("open", "");
    document.body.style.overflow = "hidden";
  }

  function hide() {
    viewer.removeAttribute("open");
    viewerImg.src = "";
    document.body.style.overflow = "";
    if (index > -1) cells[index].focus();
  }

  cells.forEach(function (cell, i) {
    cell.addEventListener("click", function (e) {
      e.preventDefault();
      show(i);
    });
  });

  viewer.addEventListener("click", function (e) {
    var cls = e.target.className;
    if (cls === "prev") show(index - 1);
    else if (cls === "next") show(index + 1);
    else if (e.target === viewer || cls === "close" || e.target === viewerImg) hide();
  });

  document.addEventListener("keydown", function (e) {
    if (!viewer.hasAttribute("open")) return;
    if (e.key === "Escape") hide();
    else if (e.key === "ArrowLeft") show(index - 1);
    else if (e.key === "ArrowRight") show(index + 1);
  });
})();
</script>
</body>
</html>
